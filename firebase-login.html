<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MACTION · Firebase 登录</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="mobile.css"><script type="module" src="firebase-session.js"></script></head><body><section id="login-preview"><div class="login-brand-panel"><img src="login-brand.png" alt="MACTION 金色 Logo"><p>MACTION CUSTOMER RELATIONSHIP MANAGEMENT</p></div><div class="login-card"><span class="login-kicker">MACTION CRM</span><h1>员工登录</h1><p>客户、课程与服务管理中心</p><form id="firebase-login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password" style="margin-top:16px">密码</label><input id="password" type="password" autocomplete="current-password" required><button class="login-submit" id="sign-in" disabled>正在加载登录组件…</button></form><button class="button" id="firebase-signout" hidden>退出账号</button><p id="firebase-status" role="status" class="login-preview-note">请输入已获授权的员工账号。</p></div></section></body></html>
